  <text x="24" y="88" fill="#21173F" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Front of card — four edges visible</text>
  <rect x="200" y="150" width="400" height="250" rx="16" fill="linear-gradient" stroke="#4D1B7A" stroke-width="3"/>
